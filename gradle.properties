# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# commonTest runs on the jvm and iOS targets on purpose (see KmpLibraryConventionPlugin);
# Android host tests are intentionally disabled, so AGP's reminder about them is noise.
android.sync.suppressAgpWarnings=GENERIC

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
